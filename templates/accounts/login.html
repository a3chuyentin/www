{% extends 'base.html' %}
{% block title %}Đăng nhập - A3 Chuyên Tin{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="card">
        <h2 class="text-2xl font-bold text-surface-900 mb-6 flex items-center gap-2">
            <i class="fas fa-sign-in-alt text-brand-500"></i> Đăng nhập
        </h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-semibold text-surface-700 mb-1.5">Tên đăng nhập</label>
                <input type="text" name="username" class="form-input" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-surface-700 mb-1.5">Mật khẩu</label>
                <input type="password" name="password" class="form-input" required>
            </div>
            <button type="submit" class="btn w-full justify-center">Đăng nhập</button>
        </form>
        <p class="mt-4 text-center text-sm text-surface-500">
            Chưa có tài khoản? <a href="{% url 'register' %}" class="text-brand-600 hover:text-brand-700 font-semibold">Đăng ký ngay</a>
        </p>
    </div>
</div>
{% endblock %}
