{% extends 'base.html' %}
{% block title %}Xóa bài viết - A3 Chuyên Tin{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="card text-center">
        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-exclamation-triangle text-red-500 text-2xl"></i>
        </div>
        <h2 class="text-xl font-bold text-surface-900 mb-2">Xóa bài viết</h2>
        <p class="text-surface-500 mb-6">Bạn có chắc chắn muốn xóa bài viết "<strong>{{ post.title }}</strong>" không?</p>
        <form method="post" class="flex gap-3 justify-center">
            {% csrf_token %}
            <button type="submit" class="btn-danger">Xóa</button>
            <a href="{% url 'post_detail' post.pk %}" class="btn-secondary">Hủy</a>
        </form>
    </div>
</div>
{% endblock %}
