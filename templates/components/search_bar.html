<div class="mb-6">
    <form method="get" action="{{ search_action }}" class="flex max-w-md">
        <input type="text" 
               name="q" 
               value="{{ search_query|default:'' }}" 
               placeholder="{{ search_placeholder|default:'Tìm kiếm...' }}" 
               class="flex-1 px-4 py-2.5 bg-surface-50 border-2 border-surface-200 rounded-l-xl focus:border-brand-500 focus:outline-none font-medium text-surface-700 placeholder-surface-400">
        <button type="submit" class="px-4 py-2.5 bg-brand-500 hover:bg-brand-600 text-white rounded-r-xl transition-colors">
            <i class="fas fa-search"></i>
        </button>
    </form>
</div>
